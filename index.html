<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المولدات</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

    <div class="container">
        <h1>نظام إدارة تشغيل المولدات</h1>
        <button id="addBtn" class="main-btn">إضافة مولد جديد +</button>
        <button id="exportBtn" class="export-btn">استخراج إكسيل (Excel) 📊</button>
        <button id="newMonthBtn" class="export-btn" style="background-color: red; color: white;">بدء شهر جديد (مسح الكل)</button>

        <div id="generatorsList" class="cards-grid">
            </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modalTitle">إدخال بيانات المولد</h2>
            <form id="genForm">
                <input type="hidden" id="editIndex"> <div class="form-grid">
                    <div class="field"><label>اسم المكتب:</label><input type="text" id="office" required></div>
                    <div class="field"><label>رقم البلاغ:</label><input type="text" id="reportNo" required></div>
                    <div class="field"><label>تاريخ التغذية:</label><input type="date" id="feedDate"></div>
                    <div class="field"><label>رقم مهمة التغذية:</label><input type="text" id="feedTask"></div>
                    <div class="field"><label>تاريخ الإزالة:</label><input type="date" id="removeDate"></div>
                    <div class="field"><label>رقم مهمة الإزالة:</label><input type="text" id="removeTask"></div>
                    <div class="field"><label>نوع العطل:</label><input type="text" id="faultType"></div>
                    <div class="field"><label>رقم المعدة:</label><input type="text" id="equipNo"></div>
                    <div class="field"><label>وقت الطلب:</label><input type="time" id="requestTime"></div>
                    <div class="field"><label>وقت التشغيل:</label><input type="time" id="startTime"></div>
                    <div class="field"><label>وقت الفصل:</label><input type="time" id="stopTime"></div>
                    <div class="field"><label>رقم المولد:</label><input type="text" id="genNo"></div>
                    <div class="field full-width"><label>الملاحظات:</label><textarea id="notes"></textarea></div>
                </div>
                <button type="submit" id="saveBtn" class="save-btn">حفظ البيانات</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
